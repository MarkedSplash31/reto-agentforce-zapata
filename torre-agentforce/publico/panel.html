<!DOCTYPE html>
<html lang="es-MX" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de asesor · Zapata</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/tailwind.css">
<link rel="stylesheet" href="css/sistema.css">
</head>
<body class="bg-[#0b0c10] text-gray-100 font-sans-clean antialiased selection:bg-neutral-700 selection:text-white">

<div id="nav"></div>

<main class="pt-20">
  <section class="max-w-7xl mx-auto px-6 py-24">

    <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 mb-16">
      <div>
        <span class="text-xs uppercase tracking-[0.3em] text-gray-500 block mb-2">Interno</span>
        <h1 class="font-serif-luxury text-3xl text-white tracking-wide font-light">Conversaciones escaladas</h1>
        <p class="text-gray-400 text-xs font-light mt-2 leading-relaxed max-w-2xl">
          Clientes que pidieron hablar con una persona. Lo que escribas les llega en vivo
          y queda asentado en el expediente de su caso.
        </p>
      </div>
      <button id="salir" type="button"
        class="shrink-0 border border-white/10 px-5 py-2.5 text-xs uppercase tracking-widest text-white hover:bg-white hover:text-black transition-colors duration-300">
        Cerrar sesión
      </button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

      <div>
        <div class="border border-white/5 bg-[#0d0e12] p-6">
          <div class="flex items-center justify-between gap-3 mb-4">
            <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500">En espera</p>
            <span id="conteo" class="text-[10px] uppercase tracking-widest text-amber-400"></span>
          </div>
          <div id="bandeja" class="space-y-3" aria-live="polite"></div>
        </div>
      </div>

      <div class="lg:col-span-2">
        <div class="border border-white/5 bg-[#0d0e12] flex flex-col min-h-[520px]">
          <div id="cabecera" class="border-b border-white/5 p-4"></div>
          <div id="hilo" role="log" aria-live="polite" aria-relevant="additions"
               class="flex-1 p-4 sm:p-6 space-y-4 overflow-y-auto max-h-[460px]"></div>
          <div class="border-t border-white/5 p-4">
            <form id="form" class="flex flex-col sm:flex-row gap-3">
              <label for="entrada" class="sr-only">Respuesta para el cliente</label>
              <input id="entrada" autocomplete="off" placeholder="Elige una conversación de la lista" disabled
                class="flex-1 min-w-0 bg-[#0b0c10] border border-white/10 text-white px-3 py-2.5 text-xs focus:outline-none focus:border-white/40 transition-colors rounded-none placeholder:text-gray-700 disabled:opacity-40">
              <button id="enviar" type="submit" disabled
                class="bg-white text-black px-8 py-2.5 text-xs uppercase tracking-widest font-medium hover:bg-neutral-200 transition-all duration-300 disabled:opacity-40 disabled:cursor-not-allowed">
                Responder
              </button>
            </form>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<div id="footer"></div>

<script type="module" src="/js/paginas/panel.js"></script>

</body>
</html>
